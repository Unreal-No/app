[package]
name = "mochimon-desktop"
version = "0.0.1"
description = "Mochimon — desktop hybrid virtual pet"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "mochimon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
