name: Build Windows installer

# สร้างตัวติดตั้ง Windows (NSIS) ของแอป Desktop แล้วแนบเป็น artifact ให้ดาวน์โหลดไปทดสอบ
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build installer
        run: pnpm desktop:build
        env:
          # รุ่นที่แสดงใน tooltip ของ tray และสมุดฟาร์ม (commit ของ branch ไม่ใช่ merge commit ของ PR)
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: mochimon-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
